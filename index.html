<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>МедТренажёр — учим названия лекарств</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">💊</span>
      <div>
        <div class="brand-title">МедТренажёр</div>
        <div class="brand-sub">Названия лекарств и товаров аптеки — по фото упаковки</div>
      </div>
    </div>
    <nav class="topnav">
      <button class="tnav-btn active" data-view="home">Главная</button>
      <button class="tnav-btn" data-view="stats">Статистика</button>
    </nav>
  </header>

  <main id="view-home" class="view">

    <section class="panel">
      <div class="panel-head">
        <h2>1. Категории</h2>
        <div class="panel-actions">
          <button id="cat-all" class="btn-ghost">Выбрать все</button>
          <button id="cat-none" class="btn-ghost">Снять все</button>
        </div>
      </div>
      <div id="cat-grid" class="cat-grid"><div class="cat-loading">Загрузка каталога…</div></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>2. Тип задания</h2></div>
      <div id="mode-grid" class="mode-grid"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>3. Настройки и старт</h2></div>
      <div class="setup-row">
        <label class="setup-field">
          Вопросов за сессию
          <select id="opt-count">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="40">40</option>
            <option value="0">Весь выбранный пул</option>
          </select>
        </label>
        <label class="setup-field setup-check">
          <input type="checkbox" id="opt-hide" checked />
          Скрывать название на фото (размытием)
        </label>
        <label class="setup-field setup-check">
          <input type="checkbox" id="opt-weighted" checked />
          Чаще показывать то, в чём чаще ошибаюсь
        </label>
      </div>
      <div class="setup-summary" id="setup-summary">Выберите категории</div>
      <button id="start-btn" class="btn-primary" disabled>Начать</button>
    </section>

  </main>

  <main id="view-quiz" class="view hidden">
    <div class="quiz-head">
      <button id="quiz-quit" class="btn-ghost">← Выйти</button>
      <div class="quiz-progress">
        <div class="quiz-progress-bar"><div id="quiz-progress-fill" class="quiz-progress-fill"></div></div>
        <div id="quiz-progress-text" class="quiz-progress-text">0 / 0</div>
      </div>
      <div id="quiz-score" class="quiz-score">✔ 0 · ✘ 0</div>
    </div>
    <div id="quiz-mode-title" class="quiz-mode-title"></div>
    <div id="quiz-body" class="quiz-body"></div>
  </main>

  <main id="view-result" class="view hidden">
    <div class="result-card">
      <h2 id="result-title">Готово!</h2>
      <div id="result-score" class="result-score"></div>
      <div id="result-mistakes" class="result-mistakes"></div>
      <div class="result-actions">
        <button id="result-retry-mistakes" class="btn-primary hidden">Повторить ошибки</button>
        <button id="result-again" class="btn-ghost">Ещё раз</button>
        <button id="result-home" class="btn-ghost">В меню</button>
      </div>
    </div>
  </main>

  <main id="view-stats" class="view hidden">
    <div class="panel">
      <div class="panel-head">
        <h2>Статистика по категориям</h2>
        <button id="stats-reset" class="btn-ghost">Сбросить прогресс</button>
      </div>
      <div id="stats-body"></div>
    </div>
  </main>

</div>
<script src="app.js"></script>
</body>
</html>
